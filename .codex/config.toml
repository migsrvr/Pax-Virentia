# Project defaults for Codex Senior; keep user-wide settings intact.
model = "gpt-6.1-sol"
model_reasoning_effort = "high"

[agents]
enabled = true
# This cap excludes Codex Senior: at most three open subagents per session.
max_concurrent_threads_per_session = 3
default_subagent_model = "gpt-6.1-sol"
default_subagent_reasoning_effort = "high"
