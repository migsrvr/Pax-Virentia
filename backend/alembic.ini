# Alembic CLI configuration. Deployments normally run `python -m app.bootstrap`,
# which applies the same revisions programmatically.
#   alembic upgrade head      (from the backend directory; uses DATABASE_URL)
#   alembic current
[alembic]
script_location = app/migrations
prepend_sys_path = .

[loggers]
keys = root,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
